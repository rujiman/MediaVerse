# Publica una versión de MediaVerse para Windows y Linux.
#
# Se lanza solo al subir una etiqueta de versión:
#     git tag v1.2.1
#     git push origin v1.2.1
# (también se puede lanzar a mano desde la pestaña Actions de GitHub).
#
# Crea la Release con las notas de esa versión del CHANGELOG.md y sube:
#   MediaVerse.jar            → actualizador de Windows
#   MediaVerse-portable.zip   → instalación nueva en Windows
#   MediaVerse-linux.jar      → actualizador de Linux
#   MediaVerse-linux.tar.gz   → instalación nueva en Linux
#
# Al terminar, avisa en Discord (canal de novedades) si el repo tiene el
# secreto DISCORD_WEBHOOK. Con DISCORD_ROLE_AVISOS, menciona a ese rol.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta ya existente a publicar (p. ej. v1.2.1)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  JAVAFX_VERSION: '25'
  MODULES: javafx.base,javafx.graphics,javafx.controls,javafx.fxml,javafx.media,java.base,java.desktop,java.sql,java.naming,java.management,java.security.jgss

jobs:
  release:
    name: Crear la Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Comprobar que la versión de la app coincide con la etiqueta
        run: |
          VERSION="${TAG#v}"
          APP=$(grep -oP 'VERSION = "\K[^"]+' src/main/java/com/rujiman/mediatracker/util/AppInfo.java)
          POM=$(grep -m1 -oP '(?<=<version>)[0-9][^<]*(?=</version>)' pom.xml)
          echo "Etiqueta: $VERSION, AppInfo: $APP, pom: $POM"
          if [ "$APP" != "$VERSION" ] || [ "$POM" != "$VERSION" ]; then
            echo "::error::AppInfo.VERSION ($APP) o pom.xml ($POM) no coinciden con la etiqueta $TAG. Sube la versión antes de etiquetar."
            exit 1
          fi

      - name: Notas desde el CHANGELOG
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; if (index($0, "[" v "]")) { on = 1; next } }
            on { print }
          ' CHANGELOG.md | sed '/^---$/d' > notes.md
          if [ ! -s notes.md ]; then echo "MediaVerse $VERSION" > notes.md; fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MediaVerse ${{ env.TAG }}
          body_path: notes.md

  build:
    name: Compilar (${{ matrix.platform }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            jfx: windows-x64
          - platform: linux
            os: ubuntu-22.04
            jfx: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar el jar
        run: mvn -B clean package -DskipTests

      # Los jmods se guardan en la caché de GitHub: así, si la web de
      # Gluon falla un rato, las siguientes versiones se compilan igual.
      - name: Caché de los jmods de JavaFX
        id: jfx-cache
        uses: actions/cache@v4
        with:
          path: jfx
          key: javafx-jmods-${{ env.JAVAFX_VERSION }}-${{ matrix.jfx }}

      - name: Descargar los jmods de JavaFX
        run: |
          if [ ! -d jfx ] || [ -z "$(ls -A jfx 2>/dev/null)" ]; then
            curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors --connect-timeout 30 \
              -o jmods.zip "https://download2.gluonhq.com/openjfx/${JAVAFX_VERSION}/openjfx-${JAVAFX_VERSION}_${{ matrix.jfx }}_bin-jmods.zip"
            unzip -q jmods.zip -d jfx
          fi
          JMODS="$(cd jfx/*/ && pwd)"
          if [ "${{ matrix.platform }}" = windows ]; then JMODS="$(cygpath -m "$JMODS")"; fi
          echo "JMODS=$JMODS" >> "$GITHUB_ENV"

      - name: Empaquetar (Windows)
        if: matrix.platform == 'windows'
        run: |
          mkdir input && cp target/MediaVerse.jar input/
          jpackage --input input --main-jar MediaVerse.jar \
            --main-class com.rujiman.mediatracker.Main \
            --name MediaVerse --app-version "${TAG#v}" --type app-image \
            --icon mediaverse_logo.ico \
            --module-path "$JMODS" --add-modules "$MODULES" \
            --dest dist
          cp .env.example dist/MediaVerse/app/
          cp target/MediaVerse.jar MediaVerse.jar
          (cd dist && 7z a -tzip -mx=9 ../MediaVerse-portable.zip MediaVerse > /dev/null)
          ls -la MediaVerse.jar MediaVerse-portable.zip

      - name: Empaquetar (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir input && cp target/MediaVerse.jar input/
          jpackage --input input --main-jar MediaVerse.jar \
            --main-class com.rujiman.mediatracker.Main \
            --name MediaVerse --app-version "${TAG#v}" --type app-image \
            --icon src/main/resources/com/rujiman/mediatracker/views/icons/mediaverse_logo.png \
            --module-path "$JMODS" --add-modules "$MODULES" \
            --dest dist
          cp .env.example dist/MediaVerse/
          cp target/MediaVerse.jar MediaVerse-linux.jar
          tar czf MediaVerse-linux.tar.gz -C dist MediaVerse
          ls -la MediaVerse-linux.jar MediaVerse-linux.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            MediaVerse.jar
            MediaVerse-portable.zip
            MediaVerse-linux.jar
            MediaVerse-linux.tar.gz
          fail_on_unmatched_files: false

  discord:
    name: Avisar en Discord
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Publicar la versión en Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE: ${{ secrets.DISCORD_ROLE_AVISOS }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No hay secreto DISCORD_WEBHOOK: no se avisa en Discord."
            exit 0
          fi
          python3 - <<'EOF'
          import json, os, re
          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          repo = os.environ["GITHUB_REPOSITORY"]
          role = os.environ.get("ROLE", "").strip()

          # Notas de esta versión en el CHANGELOG (igual que la Release)
          notes, on = [], False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              line = line.rstrip("\n")
              if line.startswith("## ["):
                  if on:
                      break
                  on = f"[{version}]" in line
                  continue
              if on and line.strip() != "---":
                  notes.append(re.sub(r"^#{1,6}\s*(.+)$", r"**\1**", line))
          text = re.sub(r"\n{3,}", "\n\n", "\n".join(notes)).strip() or f"MediaVerse {version}"
          if len(text) > 3700:
              text = text[:3700].rsplit("\n", 1)[0] + "\n…"

          url = f"https://github.com/{repo}/releases/tag/{tag}"
          payload = {
              "username": "MediaVerse",
              "avatar_url": f"https://raw.githubusercontent.com/{repo}/main/docs/assets/logo.png",
              "content": f"<@&{role}> ¡Ya está aquí MediaVerse {version}!" if role else "",
              "allowed_mentions": {"roles": [role] if role else []},
              "embeds": [{
                  "title": f"🚀 MediaVerse {version}",
                  "url": url,
                  "description": text + f"\n\n**[Descargar]({url})** · Si ya la tienes, se actualiza sola al abrirla",
                  "color": 0xEC4D80,
              }],
          }
          json.dump(payload, open("discord.json", "w", encoding="utf-8"), ensure_ascii=False)
          EOF
          curl -fsS -H "Content-Type: application/json" --data-binary @discord.json "$WEBHOOK"
          echo "Aviso enviado a Discord."
